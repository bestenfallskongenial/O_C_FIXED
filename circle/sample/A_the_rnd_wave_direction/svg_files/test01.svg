<!-- base: top-left -->
<path
    id="TARGET_MODE_TL"
    
    stroke-width="1"         
    fill="#000000"
    d="
        M 147 131
        H 171
        A 16 16 0 0 1 186.77 144.29
        A 48 48 0 0 0 144.29 186.77
        A 16 16 0 0 1 131 171
        V 147
        A 16 16 0 0 1 147 131
        Z
    "/>

<!-- mirror X: top-right -->
<path
    id="TARGET_MODE_TR"
    stroke-width="1"     
    fill="#000000"
    transform="translate(384 0) scale(-1 1)"
    d="
        M 147 131
        H 171
        A 16 16 0 0 1 186.77 144.29
        A 48 48 0 0 0 144.29 186.77
        A 16 16 0 0 1 131 171
        V 147
        A 16 16 0 0 1 147 131
        Z
    "/>

